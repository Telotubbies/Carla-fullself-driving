carla:
  host: localhost
  port: 2000
  timeout: 10.0
  town: Town04
  vehicle: vehicle.tesla.model3
  weather: ClearNoon
  spawn_point_index: 0
  synchronous_mode: true
  fixed_delta_seconds: 0.05
camera:
  width: 640
  height: 480
  fov: 90
  fps: 20
  location:
    x: 2.0
    y: 0.0
    z: 1.4
  rotation:
    pitch: 0.0
    yaw: 0.0
    roll: 0.0
perception:
  model: resnet18
  pretrained: true
  freeze_backbone: false
  feature_dim: 512
  input_size:
  - 640
  - 480
  resnet_model_path: data/autopilot_20260208_150902/resnet_lane_model/resnet_lane_final.pth
  lane_detection_model_path: data/autopilot_20260208_150902/resnet_lane_model/resnet_lane_final.pth
  use_carla_lane_detection: true
temporal:
  input_size: 512
  hidden_size: 256
  num_layers: 2
  sequence_length: 10
  dropout: 0.1
  trained_model_path: data/autopilot_20260208_150902/lstm_model/best_model.pth
mpc:
  horizon: 10
  dt: 0.05
  vehicle:
    wheelbase: 2.875
    max_steer: 0.5
    max_accel: 3.0
    max_decel: -3.0
  weights:
    lateral_error: 10.0
    heading_error: 5.0
    velocity_error: 2.0
    steer_rate: 1.0
    accel_rate: 1.0
  constraints:
    max_speed: 30.0
    min_speed: 0.0
visualization:
  window_width: 1280
  window_height: 720
  update_rate: 20
  show_camera: true
  show_trajectory: true
  show_graphs: true
  graph_history: 1000
data_collection:
  enabled: false
  save_path: data
  save_images: true
  save_states: true
  save_controls: true
logging:
  level: INFO
  log_dir: logs
  save_trajectory: true
  save_controls: true
  save_predictions: true
safety:
  emergency_brake_enabled: true
  max_speed_kmh: 30.0
  collision_timeout: 5.0
database:
  enabled: false
  postgresql:
    host: localhost
    port: 5432
    database: carla_training
    user: postgres
    password: postgres
