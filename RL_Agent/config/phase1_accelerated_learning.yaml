# Phase 1 Configuration: Accelerated Learning
# เทคนิคช่วยให้ model เรียนรู้ได้เร็วขึ้น
# Compatible with existing checkpoints

# Environment Settings
environment:
  carla_host: "localhost"
  carla_port: 2000
  town: "Town01_Opt"  # ✅ Smallest town (optimized - roads only, no buildings)
  timeout: 20.0
  
  no_rendering_mode: true  # ✅ Disabled for faster training (reduces server load significantly)
  
  # Curriculum Learning: เริ่มจากง่ายไปยาก
  curriculum_learning:
    enabled: true
    initial_difficulty: 0.0  # เริ่มจาก 0% ความยาก (ถนนว่าง)
    difficulty_increase_rate: 0.005  # เพิ่ม 0.5% ทุก 10,000 steps (fallback ถ้าไม่ใช้ reward-based)
    max_difficulty: 1.0
    
    # Reward-based curriculum: ถ้า reward ดีก็ไป phase ต่อไปได้เลย
    reward_based: true  # ใช้ reward-based แทน time-based
    reward_threshold: 10.0  # Mean reward threshold (ถ้า mean reward >= นี้ก็ไป phase ต่อไป)
    reward_window_size: 50  # จำนวน episodes ที่ใช้คำนวณ mean reward
    
    # ควบคุมความยากผ่าน:
    num_vehicles: [0, 10]  # เริ่มจาก 0 คัน, เพิ่มเป็น 10 คัน
    num_pedestrians: [0, 5]  # เริ่มจาก 0 คน, เพิ่มเป็น 5 คน
    enable_traffic: false  # เริ่มจากไม่มี traffic, แล้วค่อยเปิด
  
  # เริ่มต้นง่าย (จะเพิ่มความยากตาม curriculum)
  num_vehicles: 0  # เริ่มจาก 0 คัน (ถนนว่าง)
  num_pedestrians: 0  # เริ่มจาก 0 คน
  enable_traffic: false  # ไม่มี traffic
  
  domain_randomization:
    enabled: true
    weather_randomization: false  # ✅ Disabled for faster training (reduces CPU load)
    vehicle_randomization: false  # ✅ Disabled - using only vehicle.tesla.model3
    spawn_randomization: true
    
    weather:
      cloudiness_range: [0.0, 50.0]
      precipitation_range: [0.0, 30.0]
      sun_altitude_range: [15.0, 90.0]
      fog_density_range: [0.0, 20.0]
    
    vehicle_blueprints:
      - "vehicle.tesla.model3"
      - "vehicle.audi.tt"
      - "vehicle.mercedes.coupe"
      - "vehicle.bmw.grandtourer"
  
  weather:
    cloudiness: 0.0
    precipitation: 0.0
    sun_altitude_angle: 45.0
  
  vehicle:
    blueprint: "vehicle.tesla.model3"
    spawn_random: true

# Sensor Configuration
sensors:
  rgb_camera:
    enabled: true
    width: 160  # ✅ Restored for compatibility with checkpoint (186k steps)
    height: 90  # ✅ Restored for compatibility with checkpoint
    fov: 110
    location: [1.5, 0.0, 2.4]
    rotation: [0.0, 0.0, 0.0]
  
  depth_camera:
    enabled: true
    width: 160  # ✅ Restored for compatibility with checkpoint
    height: 90  # ✅ Restored for compatibility with checkpoint
    fov: 110
    location: [1.5, 0.0, 2.4]
    rotation: [0.0, 0.0, 0.0]
  
  gps:
    enabled: true
    location: [1.0, 0.0, 2.8]
  
  sequence_length: 4

# Observation Space
observations:
  image_size: [160, 90]  # ✅ Restored for compatibility with checkpoint (186k steps)
  use_depth: true
  normalize: true
  stack_frames: 4  # ✅ Restored for compatibility with checkpoint
  use_gps: true
  use_goal: true
  use_waypoint: true    # NEW: Waypoint Following (Priority 2) - +20-30% learning speed
  use_velocity: true    # NEW: Velocity Information (Priority 3) - +10-15% speed control
  use_vision_waypoint: true  # ✅ ENABLED: Use vision-based lane detection (real-world) instead of CARLA API
                              # Uses computer vision (Canny + Hough) for lane detection
                              # More realistic, closer to real-world autonomous driving
                              # Model will learn perception from vision
  edge_detection_method: "multiscale_canny"  # Edge detection algorithm: 'canny', 'multiscale_canny', 'enhanced_canny'
                                              # multiscale_canny: Best performance (detects both lanes)
                                              # enhanced_canny: Better preprocessing (CLAHE + Bilateral)
                                              # canny: Standard Canny (original)
  
  # Data Augmentation (เพิ่ม robustness, ไม่ใช้ RAM เพิ่ม)
  augmentation:
    enabled: true
    methods:
      - color_jitter
      - gaussian_noise
      - motion_blur
      - random_erasing
    color_jitter_prob: 0.5
    color_jitter_brightness: 0.2
    color_jitter_contrast: 0.2
    color_jitter_saturation: 0.2
    gaussian_noise_prob: 0.3
    gaussian_noise_std: 0.1
    motion_blur_prob: 0.3
    motion_blur_kernel: 5
    random_erasing_prob: 0.1
    random_erasing_area: 0.1
  
  # Option A: Observation Buffer Cache (ใช้ RAM +2-4 GB, ลด I/O)
  buffer_cache:
    enabled: true
    size: 32  # Cache 32 observations (~2-4 GB RAM)

# Action Space
actions:
  steering_range: [-1.0, 1.0]
  throttle_range: [0.0, 1.0]
  brake_range: [0.0, 1.0]
  action_repeat: 1  # ลดจาก 4 เป็น 1 เพื่อความเร็วสูงสุด (เก็บข้อมูลเร็วขึ้น ~4x)

# Reward Function - Enhanced for Faster Learning
# เริ่มจากง่าย: ให้ reward เต็มที่สำหรับพื้นฐาน (lane keeping, speed)
rewards:
  # Positive rewards - เพิ่ม weight เพื่อให้เรียนรู้เร็วขึ้น
  lane_center_reward: 3.0      # เพิ่มจาก 1.0 (ให้ความสำคัญกับการอยู่ในเลน - สำคัญมาก!)
  speed_reward: 1.5            # เพิ่มจาก 0.5 (ให้ความสำคัญกับความเร็ว)
  smooth_steering_reward: 0.8  # เพิ่มจาก 0.3 (ให้ความสำคัญกับการขับที่ลื่นไหล)
  progress_reward: 4.0         # เพิ่มจาก 2.0 (ให้ความสำคัญกับการเดินหน้า - สำคัญมาก!)
  
  # Advanced rewards
  obstacle_avoidance_reward: 2.0  # เพิ่มจาก 1.0
  lane_change_reward: 1.0         # เพิ่มจาก 0.5
  safe_stop_reward: 1.0           # เพิ่มจาก 0.5
  
  # Goal-based rewards - สำคัญมากสำหรับการเรียนรู้
  goal_distance_reward: 0.5       # เพิ่มจาก 0.1 (ให้ reward มากขึ้นเมื่อเข้าใกล้ goal)
  goal_reached_reward: 200.0      # เพิ่มจาก 100.0 (reward ใหญ่เมื่อถึง goal)
  goal_reached_threshold: 5.0
  
  # Negative rewards (penalties) - ลด penalty เพื่อไม่ให้ model กลัวเกินไป
  collision_penalty: -30.0      # ลดจาก -50.0 (ไม่ให้กลัวเกินไป)
  off_lane_penalty: -5.0        # ลดจาก -10.0 (ให้ลองผิดลองถูกได้)
  jerk_penalty: -0.3            # ลดจาก -0.5
  low_speed_penalty: -0.05       # ลดจาก -0.1
  
  # Reward shaping parameters
  target_speed: 70.0
  min_speed: 40.0
  max_speed: 100.0
  speed_tolerance: 5.0
  lane_center_tolerance: 0.5
  safe_distance: 10.0
  critical_distance: 5.0
  high_speed_penalty: 0.2
  
  # Progressive Reward Scaling (ช่วยการเรียนรู้)
  progressive_rewards:
    enabled: true
    initial_scale: 1.0  # เริ่มจาก 100% (ให้ reward เต็มที่ตั้งแต่แรก)
    final_scale: 1.0    # คงที่ 100%
    scale_increase_rate: 0.0  # ไม่ต้องเพิ่ม (ใช้เต็มที่เลย)

# Training Configuration - Optimized for Learning Speed
training:
  algorithm: "PPO"
  
  # PPO Hyperparameters - Tuned for Faster Learning
  ppo:
    learning_rate: 0.0005  # เพิ่มจาก 0.0003 (เรียนรู้เร็วขึ้น)
    n_steps: 2048  # ✅ ลดจาก 8000 เพื่อให้ PPO update เร็วขึ้น (ไม่ค้าง) - 2048 steps = ~27 batches per update
    batch_size: 512  # เพิ่มจาก 256 (GPU ทำงานมากขึ้น, เร็วขึ้น)
    n_epochs: 4  # ✅ ลดจาก 7 เพื่อให้ update เร็วขึ้น (ไม่ค้าง) - 4 epochs = ~16 batches per update
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.02  # เพิ่มจาก 0.01 (explore มากขึ้น)
    vf_coef: 0.5
    max_grad_norm: 0.5
    
    # Learning Rate Schedule (ช่วยการเรียนรู้)
    lr_schedule:
      type: "linear"  # linear decay
      initial_lr: 0.0005
      final_lr: 0.0001
      total_steps: 500000
  
  # Training schedule
  total_timesteps: 500000
  save_freq: 1000  # Save ทุก 1k steps (บ่อยมาก - สำหรับ monitoring)
  save_format: "both"  # 'old', 'new', or 'both' - Save format (both = compatible + enhanced)
  
  # Imitation Learning Pre-training
  imitation_learning:
    enabled: true  # ✅ Enabled - IL model trained and ready
    pretrained_path: "checkpoints/il_pretrained/best_il_model.pt"  # Path to IL pre-trained model
  
  # Option B: Data Prefetching (ใช้ RAM +1-2 GB, เพิ่ม throughput ~10-20%)
  prefetching:
    enabled: true
  
  # Option C: Prioritized Experience Replay (ใช้ RAM +10-50 GB, เพิ่ม sample efficiency 2-3x)
  prioritized_replay:
    enabled: true
    capacity: 100000  # เก็บ 100k transitions (~48 GB RAM) - เพิ่มจาก 50k
    alpha: 0.6  # Priority exponent (0 = uniform, 1 = full priority)
    beta: 0.4  # Importance sampling exponent (0 = no correction, 1 = full)
    beta_increment: 0.001  # เพิ่ม beta ทุก sample
    update_freq: 1000  # Update priorities ทุก N steps
  
  # Option D: Hindsight Experience Replay (HER) - เรียนรู้จาก failed episodes
  hindsight_replay:
    enabled: true  # ✅ Enable HER for goal-based tasks
    capacity: 50000  # เก็บ 50k transitions (~24 GB RAM)
    goal_dim: 3  # (x, y, z) for goal location
    k: 4  # Number of hindsight goals per transition
    hindsight_prob: 0.5  # Probability to use hindsight goal (50%)
    # HER จะช่วยให้เรียนรู้จาก failed episodes โดยสมมติ goal = สถานะสุดท้าย
    # เพิ่ม sample efficiency 2-3x สำหรับ goal-based navigation tasks
  
  # Option E: Multi-Task Learning - เรียนรู้หลาย task พร้อมกัน
  multi_task_learning:
    enabled: true  # ✅ Enable Multi-Task Learning
    task_weights:
      lane_keeping: 1.0      # Primary task: steering prediction
      speed_control: 1.0     # Secondary task: throttle/brake prediction
      obstacle_avoidance: 0.5 # Auxiliary task: obstacle detection (lower weight)
    # Multi-Task Learning จะช่วยให้:
    # - เรียนรู้ได้เร็วขึ้น 20-30%
    # - Sample efficiency เพิ่มขึ้น 1.5-2x
    # - Transfer knowledge ระหว่าง tasks
  
  eval_freq: 50000
  eval_episodes: 10
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 100000  # หยุดถ้าไม่ดีขึ้น 100k steps
    min_reward: 50.0  # ต้องได้ reward อย่างน้อย 50

# Network Architecture
network:
  vision_encoder:
    type: "ResNet"  # "CNN" or "ResNet" (ต้องเป็นตัวใหญ่)
    resnet_type: "resnet18"  # "resnet18" or "resnet34" (ใช้เมื่อ type="ResNet")
    pretrained: true  # ✅ Transfer Learning: ใช้ ImageNet pre-trained weights (ลดเวลา training 50-70%)
    freeze_early_layers: false  # Freeze early layers (conv1, bn1, maxpool, layer1) - เร็วขึ้นแต่ performance อาจต่ำกว่า
    channels: [32, 64, 128, 256]
    output_size: 512
  
  temporal:
    type: "lstm"
    hidden_size: 256
    num_layers: 2
  
  policy:
    hidden_sizes: []  # ✅ Empty list to match IL model (direct connection: 256 -> 3)
    activation: "tanh"
  
  value:
    hidden_sizes: []  # ✅ Empty list to match IL model (direct connection: 256 -> 1)
    activation: "tanh"

# Logging
logging:
  log_interval: 2000
  tensorboard_log: "logs/tensorboard"
  verbose: 1

# Checkpoints
checkpoints:
  enabled: true
  save_path: "checkpoints_new"  # ✅ New folder for fresh training (keeps old checkpoints)
  use_sqlite: false  # ใช้ zip format แทน SQLite (แบบเก่า)
  sqlite_db: "checkpoints_new/training_checkpoints.db"
  clear_on_start: false

