# Fast Optimized Configuration
# ⚡ Optimized for Speed: 2.9x faster training
# Time: ~1.4 days instead of ~4 days

actions:
  action_repeat: 4
  brake_range: [0.0, 1.0]
  steering_range: [-1.0, 1.0]
  throttle_range: [0.0, 1.0]

checkpoints:
  clear_on_start: false
  enabled: true
  save_path: checkpoints_new
  sqlite_db: checkpoints_new/training_checkpoints.db
  use_sqlite: false

environment:
  carla_host: localhost
  carla_port: 2000
  curriculum_learning:
    difficulty_increase_rate: 0.005
    enable_traffic: false
    enabled: true
    initial_difficulty: 0.0
    max_difficulty: 1.0
    num_pedestrians: [0, 5]
    num_vehicles: [0, 10]
    reward_based: true
    reward_threshold: 10.0
    reward_window_size: 50
  domain_randomization:
    enabled: true
    spawn_randomization: true
    vehicle_blueprints:
      - vehicle.tesla.model3
      - vehicle.audi.tt
      - vehicle.mercedes.coupe
      - vehicle.bmw.grandtourer
    vehicle_randomization: false
    weather:
      cloudiness_range: [0.0, 50.0]
      fog_density_range: [0.0, 20.0]
      precipitation_range: [0.0, 30.0]
      sun_altitude_range: [15.0, 90.0]
    weather_randomization: false
  enable_traffic: false
  no_rendering_mode: true
  num_pedestrians: 0
  num_vehicles: 0
  timeout: 20.0
  town: Town01_Opt
  vehicle:
    blueprint: vehicle.tesla.model3
    spawn_random: true
  weather:
    cloudiness: 0.0
    precipitation: 0.0
    sun_altitude_angle: 45.0

logging:
  log_interval: 2000
  tensorboard_log: logs/tensorboard
  verbose: 1

network:
  policy:
    activation: tanh
    hidden_sizes: []
  temporal:
    hidden_size: 256
    num_layers: 2
    type: lstm
  value:
    activation: tanh
    hidden_sizes: []
  vision_encoder:
    channels: [32, 64, 128, 256]
    freeze_early_layers: false
    output_size: 512
    pretrained: true
    resnet_type: resnet18
    type: ResNet

observations:
  augmentation:
    color_jitter_brightness: 0.2
    color_jitter_contrast: 0.2
    color_jitter_prob: 0.5
    color_jitter_saturation: 0.2
    enabled: true
    gaussian_noise_prob: 0.3
    gaussian_noise_std: 0.1
    methods:
      - color_jitter
      - gaussian_noise
      - motion_blur
      - random_erasing
    motion_blur_kernel: 5
    motion_blur_prob: 0.3
    random_erasing_area: 0.1
    random_erasing_prob: 0.1
  buffer_cache:
    enabled: true
    size: 32
  edge_detection_method: multiscale_canny
  image_size: [160, 90]
  normalize: true
  stack_frames: 4
  use_depth: true
  use_goal: true
  use_gps: true
  use_velocity: true
  use_vision_waypoint: true
  use_waypoint: true

rewards:
  collision_penalty: -30.0
  critical_distance: 5.0
  goal_distance_reward: 0.5
  goal_reached_reward: 200.0
  goal_reached_threshold: 5.0
  high_speed_penalty: 0.2
  jerk_penalty: -0.3
  lane_center_reward: 3.0
  lane_center_tolerance: 0.5
  lane_change_reward: 1.0
  low_speed_penalty: -0.05
  max_speed: 100.0
  min_speed: 40.0
  obstacle_avoidance_reward: 2.0
  off_lane_penalty: -5.0
  progress_reward: 4.0
  progressive_rewards:
    enabled: true
    final_scale: 1.0
    initial_scale: 1.0
    scale_increase_rate: 0.0
  safe_distance: 10.0
  safe_stop_reward: 1.0
  smooth_steering_reward: 0.8
  speed_reward: 1.5
  speed_tolerance: 5.0
  target_speed: 70.0

sensors:
  depth_camera:
    enabled: true
    fov: 110
    height: 90
    location: [1.5, 0.0, 2.4]
    rotation: [0.0, 0.0, 0.0]
    width: 160
  gps:
    enabled: true
    location: [1.0, 0.0, 2.8]
  rgb_camera:
    enabled: true
    fov: 110
    height: 90
    location: [1.5, 0.0, 2.4]
    rotation: [0.0, 0.0, 0.0]
    width: 160
  sequence_length: 4

training:
  algorithm: PPO
  early_stopping:
    enabled: true
    min_reward: 50.0
    patience: 100000
  eval_episodes: 10
  eval_freq: 50000
  
  # ⚡ SPEED OPTIMIZATIONS
  ppo:
    batch_size: 256        # ⚡ ลดจาก 512 (เร็วขึ้น 2x)
    clip_range: 0.2
    ent_coef: 0.02
    gae_lambda: 0.95
    gamma: 0.99
    learning_rate: 0.0006  # เพิ่มเล็กน้อยเพื่อชดเชย epochs น้อยลง
    lr_schedule:
      final_lr: 0.0001
      initial_lr: 0.0006
      total_steps: 500000
      type: linear
    max_grad_norm: 0.5
    n_epochs: 2            # ⚡ ลดจาก 4 (เร็วขึ้น 2x)
    n_steps: 2048          # เก็บไว้ (ไม่ลดเพื่อ sample efficiency)
    vf_coef: 0.5
  
  # ⚡ DISABLE SLOW FEATURES
  prefetching:
    enabled: true          # เก็บไว้ (ช่วย performance)
  prioritized_replay:
    enabled: false          # ⚡ ปิด (เร็วขึ้น 10-20%)
  hindsight_replay:
    enabled: false          # ⚡ ปิด (เร็วขึ้น 5-10%)
  
  save_format: both
  save_freq: 10000         # เพิ่มจาก 1000 (ลด I/O)
  total_timesteps: 500000

