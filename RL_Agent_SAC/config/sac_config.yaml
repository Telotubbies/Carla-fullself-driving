# SAC (Soft Actor-Critic) Configuration
# 🎯 Focus: Off-policy algorithm with replay buffer for sample efficiency
# Benefits: Better sample efficiency, stable learning, good for continuous actions

actions:
  action_repeat: 4
  brake_range: [0.0, 1.0]
  steering_range: [-1.0, 1.0]
  throttle_range: [0.0, 1.0]

checkpoints:
  clear_on_start: false
  enabled: true
  save_path: checkpoints
  save_freq: 1000  # Save checkpoint every 1k steps
  sqlite_db: checkpoints/training_checkpoints.db
  use_sqlite: true

environment:
  carla_host: localhost
  carla_port: 2000
  curriculum_learning:
    difficulty_increase_rate: 0.005
    enable_traffic: false
    enabled: true
    initial_difficulty: 0.0
    max_difficulty: 1.0
    num_pedestrians: [0, 5]
    num_vehicles: [0, 10]
    reward_based: true
    reward_threshold: 10.0
    reward_window_size: 50
  domain_randomization:
    enabled: true
    spawn_randomization: true
    vehicle_blueprints:
      - vehicle.tesla.model3
      - vehicle.audi.tt
      - vehicle.mercedes.coupe
      - vehicle.bmw.grandtourer
    vehicle_randomization: false
    weather:
      cloudiness_range: [0.0, 50.0]
      fog_density_range: [0.0, 20.0]
      precipitation_range: [0.0, 30.0]
      sun_altitude_range: [15.0, 90.0]
    weather_randomization: false
  enable_traffic: false
  no_rendering_mode: true
  num_pedestrians: 0
  num_vehicles: 0
  timeout: 20.0
  town: Town01_Opt
  vehicle:
    blueprint: vehicle.tesla.model3
    spawn_random: true
  weather:
    cloudiness: 0.0
    precipitation: 0.0
    sun_altitude_angle: 45.0

logging:
  log_interval: 2000
  tensorboard_log: logs/tensorboard
  verbose: 1

network:
  policy:
    activation: tanh
    hidden_sizes: [512, 256, 128]
  temporal:
    hidden_size: 256
    num_layers: 2
    type: lstm
  value:
    activation: tanh
    hidden_sizes: [512, 256, 128]
  vision_encoder:
    channels: [32, 64, 128, 256]
    freeze_early_layers: false
    output_size: 512
    pretrained: true
    resnet_type: resnet18
    type: ResNet

observations:
  augmentation:
    color_jitter_brightness: 0.2
    color_jitter_contrast: 0.2
    color_jitter_prob: 0.5
    color_jitter_saturation: 0.2
    enabled: true
    gaussian_noise_prob: 0.3
    gaussian_noise_std: 0.1
    methods:
      - color_jitter
      - gaussian_noise
      - motion_blur
      - random_erasing
    motion_blur_kernel: 5
    motion_blur_prob: 0.3
    random_erasing_area: 0.1
    random_erasing_prob: 0.1
  buffer_cache:
    enabled: true
    size: 32
  edge_detection_method: multiscale_canny
  image_size: [160, 90]
  normalize: true
  stack_frames: 4
  use_depth: true
  use_goal: true
  use_gps: true
  use_velocity: true
  use_vision_waypoint: true
  use_waypoint: true

# 🎯 REWARD SHAPING - Optimized for SAC learning
rewards:
  # Positive rewards (normalized to prevent reward scaling with episode length)
  lane_center_reward: 5.0
  speed_reward: 2.0
  progress_reward: 2.0  # Reduced from 6.0, now normalized per step
  smooth_steering_reward: 1.0
  goal_reached_reward: 500.0
  
  # Penalties (reduced to be less harsh during learning)
  collision_penalty: -20.0
  off_lane_penalty: -2.0
  low_speed_penalty: -0.02
  high_speed_penalty: 0.1
  jerk_penalty: -0.1
  
  # Thresholds (more forgiving)
  lane_center_tolerance: 1.0
  off_lane_threshold: 3.0
  
  # Speed settings
  target_speed: 70.0
  min_speed: 30.0
  max_speed: 100.0
  speed_tolerance: 10.0
  
  # Goal settings (normalized to prevent extreme penalties)
  goal_distance_reward: 0.1  # Reduced from 0.3, now normalized per step
  goal_reached_threshold: 10.0
  
  # Other settings
  critical_distance: 5.0
  safe_distance: 10.0
  obstacle_avoidance_reward: 2.0
  lane_change_reward: 1.0
  safe_stop_reward: 1.0
  
  # Progressive rewards (disabled for now - keep it simple)
  progressive_rewards:
    enabled: false
    final_scale: 1.0
    initial_scale: 1.0
    scale_increase_rate: 0.0

sensors:
  depth_camera:
    enabled: true
    fov: 110
    height: 90
    location: [1.5, 0.0, 2.4]
    rotation: [0.0, 0.0, 0.0]
    width: 160
  gps:
    enabled: true
    location: [1.0, 0.0, 2.8]
  rgb_camera:
    enabled: true
    fov: 110
    height: 90
    location: [1.5, 0.0, 2.4]
    rotation: [0.0, 0.0, 0.0]
    width: 160
  sequence_length: 4

training:
  algorithm: SAC
  early_stopping:
    enabled: false
    min_reward: 50.0
    patience: 100000
  eval_episodes: 10
  eval_freq: 50000
  
  # 🎯 SAC-SPECIFIC HYPERPARAMETERS
  # SAC is off-policy, so it can learn from old experiences
  sac:
    # Learning rate - Lower than PPO for stability
    learning_rate: 0.0003
    lr_schedule:
      type: linear
      initial_lr: 0.0003
      final_lr: 0.00005
      total_steps: 500000
    
    # Replay buffer - Large buffer for off-policy learning
    buffer_size: 100000        # Large buffer to store diverse experiences
    learning_starts: 1000      # Collect experiences before training starts
    batch_size: 256            # Batch size for training
    
    # Soft update (target network)
    tau: 0.005                 # Soft update coefficient (lower = slower target update)
    target_update_interval: 1  # Update target network every N gradient steps
    
    # Discount factor
    gamma: 0.99
    
    # Training frequency
    train_freq: 4              # Train every N steps (increased from 1 for better performance)
    gradient_steps: 4          # Number of gradient steps per training update (increased from 1 for better performance)
    
    # Entropy coefficient (automatic tuning)
    ent_coef: 'auto'           # 'auto' for automatic entropy tuning
    target_entropy: 'auto'     # Target entropy for automatic tuning
    
    # State-dependent exploration (SDE)
    use_sde: false             # Use state-dependent exploration
    sde_sample_freq: -1        # Sample new noise every N steps (-1 = every step)
    use_sde_at_warmup: false   # Use SDE during warmup
  
  # Features
  prefetching:
    enabled: true
  prioritized_replay:
    enabled: false             # Can enable for even better sample efficiency
  hindsight_replay:
    enabled: false             # Can enable for goal-based tasks
  
  # Imitation Learning (same as PPO)
  imitation_learning:
    enabled: false             # Enable to load IL pretrained weights
    pretrained_path: checkpoints/il_pretrained/best_il_model.pt  # Path to IL checkpoint
  
  save_format: both
  total_timesteps: 500000

# Device configuration
device:
  use_gpu: true
  gpu_id: 0
  # Mixed device settings (GPU/CPU load balancing)
  use_mixed_device: true              # Enable automatic GPU/CPU load balancing
  gpu_memory_threshold: 0.90         # Use CPU if GPU memory > 90% (will trigger at 98%)
  gpu_util_threshold: 0.85           # Use CPU if GPU utilization > 85%
  mixed_device_check_interval: 100   # Check GPU status every N steps

