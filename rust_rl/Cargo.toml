[package]
name = "carla_sac_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "carla_sac_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Deep Learning
tch = "0.14"  # PyTorch bindings for Rust
ndarray = "0.15"
ndarray-rand = "0.14"
rand = "0.8"
rand_distr = "0.4"

# Python bindings
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Utilities
rayon = "1.8"  # Parallel processing
parking_lot = "0.12"  # Fast mutex
crossbeam = "0.8"  # Concurrent data structures

# Logging
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
criterion = "0.5"  # Benchmarking

[[bench]]
name = "sac_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
